name: Release and Deploy

# This workflow handles the complete release process:
# 1. Builds standalone binaries for multiple platforms (Linux, macOS, Windows)
# 2. Publishes the library to crates.io

on:
  workflow_dispatch:
    # ARC-046: gate manual releases to the default branch — only `main`
    # may ship a release. (Tag-based triggers can be added later.)
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  # ARC-046: pre-flight — confirm CHANGELOG.md has a section for the
  # version we are about to release, so a manual dispatch can never ship
  # a release without corresponding release notes.
  changelog-guard:
    name: CHANGELOG / version cross-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Read version from Cargo.toml
        id: version
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Verify CHANGELOG.md contains matching section
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! grep -qE "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md is missing a \`## [${VERSION}]\` section for this release."
            echo "Found these version headers in CHANGELOG.md:"
            grep -nE '^## \[' CHANGELOG.md || echo "(none)"
            exit 1
          fi
          echo "CHANGELOG.md has a section for ${VERSION}."

jobs:
  # Build binaries for multiple platforms
  build-binaries:
    name: Build binary - ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: [changelog-guard]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: par-particle-life
            asset_name: par-particle-life-linux-x86_64

          - name: Linux ARM64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: par-particle-life
            asset_name: par-particle-life-linux-aarch64

          - name: macOS x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: par-particle-life
            asset_name: par-particle-life-macos-x86_64.zip

          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: par-particle-life
            asset_name: par-particle-life-macos-aarch64.zip

          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: par-particle-life.exe
            asset_name: par-particle-life-windows-x86_64.exe

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Get version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # ARC-030: --locked refuses to regenerate Cargo.lock at build time.
      - name: Build binary
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Strip binary (Unix)
        if: runner.os != 'Windows' && runner.os != 'macOS'
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            aarch64-linux-gnu-strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          else
            strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          fi

      - name: Bundle and Zip (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p par-particle-life.app/Contents/MacOS
          mkdir -p par-particle-life.app/Contents/Resources

          # Copy binary
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} par-particle-life.app/Contents/MacOS/par-particle-life
          chmod +x par-particle-life.app/Contents/MacOS/par-particle-life

          # Create .icns from PNG icons
          if [ -f assets/icon.png ]; then
            mkdir -p par-particle-life.iconset
            sips -z 16 16     assets/icon.png --out par-particle-life.iconset/icon_16x16.png
            sips -z 32 32     assets/icon.png --out par-particle-life.iconset/icon_16x16@2x.png
            sips -z 32 32     assets/icon.png --out par-particle-life.iconset/icon_32x32.png
            sips -z 64 64     assets/icon.png --out par-particle-life.iconset/icon_32x32@2x.png
            sips -z 128 128   assets/icon.png --out par-particle-life.iconset/icon_128x128.png
            sips -z 256 256   assets/icon.png --out par-particle-life.iconset/icon_128x128@2x.png
            sips -z 256 256   assets/icon.png --out par-particle-life.iconset/icon_256x256.png
            sips -z 512 512   assets/icon.png --out par-particle-life.iconset/icon_256x256@2x.png
            sips -z 512 512   assets/icon.png --out par-particle-life.iconset/icon_512x512.png
            sips -z 1024 1024 assets/icon.png --out par-particle-life.iconset/icon_512x512@2x.png
            iconutil -c icns par-particle-life.iconset -o par-particle-life.app/Contents/Resources/par-particle-life.icns
            rm -rf par-particle-life.iconset
          fi

          # Create Info.plist
          cat <<EOF > par-particle-life.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>par-particle-life</string>
              <key>CFBundleIconFile</key>
              <string>par-particle-life.icns</string>
              <key>CFBundleIdentifier</key>
              <string>com.paulrobello.par-particle-life</string>
              <key>CFBundleName</key>
              <string>par-particle-life</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${{ env.VERSION }}</string>
              <key>CFBundleVersion</key>
              <string>${{ env.VERSION }}</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.13</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          # Create zip
          zip -r ${{ matrix.asset_name }} par-particle-life.app

          mkdir -p release-binaries
          mv ${{ matrix.asset_name }} release-binaries/

      - name: Rename and Move binary (Linux/Windows)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          mkdir -p release-binaries
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} release-binaries/${{ matrix.asset_name }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.target }}
          path: release-binaries/${{ matrix.asset_name }}
          retention-days: 1

  # ARC-029: sign and notarize the macOS .app bundles. Runs only on macOS
  # runners, after the unsigned artifact has been uploaded. Requires the
  # APPLE_ID_PASSWORD secret (app-specific password for notarytool) and a
  # MACOS_CERTIFICATE (Developer ID Application .p12, base64) secret.
  sign-and-notarize:
    name: Sign & Notarize - ${{ matrix.name }}
    runs-on: macos-latest
    timeout-minutes: 25
    needs: [build-binaries]
    if: ${{ needs.build-binaries.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS x86_64
            target: x86_64-apple-darwin
            asset_name: par-particle-life-macos-x86_64.zip
          - name: macOS ARM64
            target: aarch64-apple-darwin
            asset_name: par-particle-life-macos-aarch64.zip

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download unsigned artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-${{ matrix.target }}
          path: unsigned

      - name: Unzip, sign, notarize, staple, re-zip
        env:
          # Base64-encoded Developer ID Application .p12 (Application
          # Developer ID: PAUL AARON ROBELLO (QMLVG482FY)).
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: QMLVG482FY
        run: |
          set -euo pipefail

          # Skip cleanly if signing secrets are not configured (e.g. fork PR,
          # dev environment). Production releases MUST configure these.
          if [ -z "${APPLE_ID_PASSWORD}" ] || [ -z "${MACOS_CERTIFICATE}" ]; then
            echo "::notice::macOS signing secrets not configured — publishing unsigned artifact."
            mkdir -p signed
            cp "unsigned/${{ matrix.asset_name }}" "signed/"
            exit 0
          fi

          # Import the Developer ID certificate into a fresh keychain.
          CERT_P12="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PWD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_P12"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -u "$KEYCHAIN"
          security import "$CERT_P12" -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN"

          # Unzip the .app bundle.
          WORK="$RUNNER_TEMP/bundle"
          mkdir -p "$WORK"
          unzip -o "unsigned/${{ matrix.asset_name }}" -d "$WORK"
          APP_PATH="$WORK/par-particle-life.app"

          # Hardened runtime + deep sign.
          /usr/bin/codesign \
            --deep --force \
            --options runtime \
            --timestamp \
            --sign "Developer ID Application: PAUL AARON ROBELLO (QMLVG482FY)" \
            "$APP_PATH"
          /usr/bin/codesign --verify --strict --verbose=2 "$APP_PATH"

          # Submit the zipped bundle to notarytool and block until verdict.
          ZIP_FOR_NOTARY="$RUNNER_TEMP/${{ matrix.asset_name }}"
          ( cd "$WORK" && ditto -c -k --keepParent par-particle-life.app "$ZIP_FOR_NOTARY" )
          xcrun notarytool submit "$ZIP_FOR_NOTARY" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --wait

          # Staple the notarization ticket back onto the .app.
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

          # Re-zip the signed+stapled bundle into the release artifact.
          mkdir -p signed
          ( cd "$WORK" && ditto -c -k --keepParent par-particle-life.app "signed/${{ matrix.asset_name }}" )

          # Cleanup keychain.
          security delete-keychain "$KEYCHAIN" || true

      - name: Upload signed artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.target }}
          path: signed/${{ matrix.asset_name }}
          retention-days: 1
          overwrite: true

  # Publish to crates.io
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-binaries]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Get version
        id: version
        run: |
          CARGO_VERSION=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')
          echo "version=$CARGO_VERSION" >> $GITHUB_OUTPUT
          echo "Cargo.toml version: $CARGO_VERSION"

      - name: Check if version exists on crates.io
        id: check_version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Checking if version $VERSION exists on crates.io..."

          # Search for the exact version
          if cargo search par-particle-life --limit 1 | grep -q "par-particle-life = \"$VERSION\""; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Warning: Version $VERSION already exists on crates.io"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Version $VERSION not found on crates.io, proceeding with publish"
          fi

      # ARC-050: a release cannot ship lint regressions — fail fast on
      # formatting or clippy violations before publish.
      - name: Verify formatting
        if: steps.check_version.outputs.exists == 'false'
        run: cargo fmt -- --check

      - name: Run clippy
        if: steps.check_version.outputs.exists == 'false'
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        if: steps.check_version.outputs.exists == 'false'
        run: cargo test --locked --verbose

      - name: Dry run publish
        if: steps.check_version.outputs.exists == 'false'
        run: cargo publish --locked --dry-run

      - name: Publish to crates.io
        if: steps.check_version.outputs.exists == 'false'
        run: cargo publish --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Version already exists
        if: steps.check_version.outputs.exists == 'true'
        run: |
          echo "::notice::Version ${{ steps.version.outputs.version }} already exists on crates.io. Skipping publish."

      - name: Discord notification
        if: success() && steps.check_version.outputs.exists == 'false'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        # Ilshidur/action-discord — pinned to SHA of release 0.4.0 (ARC-031 / SEC-008).
        uses: Ilshidur/action-discord@d2594079a10f1d6739ee50a2471f0ca57418b554 # 0.4.0
        with:
          args: 'Published {{ EVENT_PAYLOAD.repository.name }} v${{ steps.version.outputs.version }} to crates.io successfully!'
        continue-on-error: true

  # Create GitHub release
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [sign-and-notarize]
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Get version
        id: get_version
        run: |
          version=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "Package version: $version"

      - name: Download binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: binaries
          merge-multiple: true

      - name: List downloaded binaries
        run: ls -lh binaries/

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          VERSION="v${{ steps.get_version.outputs.version }}"

          # Check if release exists
          if gh release view "$VERSION" --repo '${{ github.repository }}' >/dev/null 2>&1; then
            echo "Release $VERSION already exists. Deleting and recreating..."
            gh release delete "$VERSION" --repo '${{ github.repository }}' --yes
          fi

          # Create new release
          gh release create \
          "$VERSION" \
          --repo '${{ github.repository }}' \
          --generate-notes \
          --latest

      - name: Upload binaries to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
          'v${{ steps.get_version.outputs.version }}' binaries/* \
          --repo '${{ github.repository }}' \
          --clobber

    outputs:
      version: ${{ steps.get_version.outputs.version }}

  publish-homebrew-cask:
    name: Publish Homebrew Cask
    needs: [github-release]
    uses: ./.github/workflows/publish-homebrew-cask-core.yml
    with:
      version: ${{ needs.github-release.outputs.version }}
    secrets: inherit
