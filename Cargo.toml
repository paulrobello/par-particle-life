[package]
name = "par-particle-life"
version = "0.3.0"
edition = "2024"
authors = ["Paul Robello <paulrobello@gmail.com>"]
license = "AGPL-3.0-or-later"
description = "GPU-accelerated particle life simulation in Rust"
repository = "https://github.com/paulrobello/par-particle-life"
keywords = ["simulation", "particles", "gpu", "wgpu", "egui"]
categories = ["simulation", "graphics", "visualization"]
rust-version = "1.93"

[dependencies]
# GPU/Graphics
wgpu = "29"
winit = "0.30"

# GUI
egui = "0.34"
egui-wgpu = "0.34"
egui-winit = "0.34"

# Math and utilities
glam = { version = "0.32", features = ["serde"] }
bytemuck = { version = "1.25", features = ["derive"] }
rand = "0.10"
rand_chacha = "0.10"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# Async/threading
pollster = "0.4"
rayon = "1.12"
crossbeam-channel = "0.5"

# Logging and errors
log = "0.4"
env_logger = "0.11"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

# Image export
image = "0.25"
gif = "0.14"
color_quant = "1.1"

# Date/time for screenshots
chrono = "0.4"

# File system utilities
dirs = "6"
open = "5"
half = { version = "2", features = ["bytemuck"] }

[dev-dependencies]
criterion = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console"] }
console_error_panic_hook = "0.1"

[[bench]]
name = "physics"
harness = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
