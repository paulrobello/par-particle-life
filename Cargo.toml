[package]
name = "par-particle-life"
version = "0.1.0"
edition = "2024"
authors = ["Paul Robello <paulrobello@gmail.com>"]
license = "AGPL-3.0-or-later"
description = "GPU-accelerated particle life simulation in Rust"
repository = "https://github.com/paulrobello/par-particle-life"
keywords = ["simulation", "particles", "gpu", "wgpu", "egui"]
categories = ["simulation", "graphics", "visualization"]
rust-version = "1.93"

[dependencies]
# GPU/Graphics
wgpu = "27.0.1"
winit = "0.30.12"

# GUI
egui = "0.33.3"
egui-wgpu = "0.33.3"
egui-winit = "0.33.3"

# Math and utilities
glam = { version = "0.31.0", features = ["serde"] }
bytemuck = { version = "1.25.0", features = ["derive"] }
rand = "0.10.0"
rand_chacha = "0.10.0"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.9.11"

# Async/threading
pollster = "0.4.0"
rayon = "1.11.0"
crossbeam-channel = "0.5.15"

# Logging and errors
log = "0.4.29"
env_logger = "0.11.8"
thiserror = "2.0.18"
anyhow = "1.0.101"
clap = { version = "4.5.57", features = ["derive"] }

# Image export
image = "0.25.9"
gif = "0.14.1"
color_quant = "1.1.0"

# Date/time for screenshots
chrono = "0.4.43"

# File system utilities
dirs = "6.0.0"
open = "5.3.3"
half = { version = "2.7.1", features = ["bytemuck"] }

[dev-dependencies]
criterion = "0.8.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.108"
web-sys = { version = "0.3.85", features = ["console"] }
console_error_panic_hook = "0.1.7"

[[bench]]
name = "physics"
harness = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
